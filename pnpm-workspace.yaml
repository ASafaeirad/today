allowBuilds:
  esbuild: true
saveExact: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plus: 0.3.1
  vitest: 4.1.11
  "@vitest/browser-playwright": 4.1.11
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - "@tanstack/history@1.162.1"
  - "@tanstack/react-router@1.170.21"
  - "@tanstack/router-core@1.171.18"
  - lucide-react@1.29.0
  - "@storybook/builder-vite@10.5.7"
  - "@storybook/csf-plugin@10.5.7"
  - "@storybook/react-dom-shim@10.5.7"
  - "@storybook/react-vite@10.5.7"
  - "@storybook/react@10.5.7"
  - "@storybook/tanstack-react@10.5.7"
  - "@tanstack/router-generator@1.167.24"
  - "@tanstack/router-plugin@1.168.26"
  - storybook@10.5.7
  - "@fullstacksjs/oxlint-minimal@1.1.1"
